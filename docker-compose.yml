x-db-url: &db-url postgresql://locfly_user:locfly_password@localhost:5433/locfly_db
x-redis-url: &redis-url redis://localhost:6379

services:
  postgres:
    image: postgres:15-alpine
    container_name: locfly-postgres
    restart: always
    environment:
      POSTGRES_USER: locfly_user
      POSTGRES_PASSWORD: locfly_password
      POSTGRES_DB: locfly_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locfly_user -d locfly_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: locfly-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
